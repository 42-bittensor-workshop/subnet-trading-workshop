[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subnet-trading"
version = "0.1.0"
description = "Build a strategy on Bittensor subnets, test it, and run it in a miner"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7", "async-substrate-interface>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "nbformat", "nbclient", "ipykernel"]
miner = ["bittensor-wallet>=4.1"]
validator = ["bittensor>=10.5,<11", "bittensor-wallet>=4.1"]

[tool.setuptools]
packages = ["subnet_trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
